name: Build Executa binaries

# Manually triggered. Builds the Executa natively on each target platform, smoke-tests
# the packaged archive, and stages the archives + SHA-256 files in a GitHub Release.
# Nothing is published to Anna from this workflow, and no secrets are used.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXECUTA_DIR: executas/my-first-anna-app
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04 # older glibc (2.35) keeps the onefile binary portable to Cloud Agent
          - platform: windows-x86_64
            runner: windows-2025
          - platform: darwin-arm64 # Apple Silicon
            runner: macos-14
          - platform: darwin-x86_64 # Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tooling
        run: python -m pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      - name: Build and package
        working-directory: ${{ env.EXECUTA_DIR }}
        run: python scripts/build_binary.py

      - name: Protocol smoke test (packaged archive)
        shell: bash
        working-directory: ${{ env.EXECUTA_DIR }}
        run: |
          set -euo pipefail
          archives=(dist/*.tar.gz dist/*.zip)
          archive=""
          for f in "${archives[@]}"; do [ -f "$f" ] && archive="$f"; done
          [ -n "$archive" ] || { echo "no archive produced" >&2; exit 1; }
          case "$archive" in
            *"-${{ matrix.platform }}."*) ;;
            *) echo "unexpected archive for ${{ matrix.platform }}: $archive" >&2; exit 1 ;;
          esac
          python scripts/smoke_test.py "$archive"
          (cd dist && cat ./*.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: executa-${{ matrix.platform }}
          path: |
            ${{ env.EXECUTA_DIR }}/dist/*.tar.gz
            ${{ env.EXECUTA_DIR }}/dist/*.zip
            ${{ env.EXECUTA_DIR }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Stage GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: executa-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets
        id: meta
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('${{ env.EXECUTA_DIR }}/executa.json'))['version'])")
          prefix="my-first-anna-app-summarizer-${version}"
          for p in darwin-arm64 darwin-x86_64 linux-x86_64; do
            for f in "${prefix}-${p}.tar.gz" "${prefix}-${p}.tar.gz.sha256"; do
              [ -f "release-assets/$f" ] || { echo "missing asset: $f" >&2; exit 1; }
            done
          done
          for f in "${prefix}-windows-x86_64.zip" "${prefix}-windows-x86_64.zip.sha256"; do
            [ -f "release-assets/$f" ] || { echo "missing asset: $f" >&2; exit 1; }
          done
          (cd release-assets && sha256sum --check --ignore-missing ./*.sha256)
          ls -l release-assets
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=executa-v${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Bump the Executa version before creating another release."
            exit 1
          fi

          # --exit-code: 0 = tag exists, 2 = no matching ref, anything else = lookup error.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Tag $TAG already exists."
            echo "Bump the Executa version before creating another release."
            exit 1
          elif [ "$rc" -ne 2 ]; then
            echo "Could not check remote tags for $TAG (git ls-remote exit code $rc)." >&2
            exit 1
          fi

          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Executa ${VERSION}" \
            --notes "Self-contained Executa binaries (PyInstaller --onefile) for darwin-arm64, darwin-x86_64, linux-x86_64 and windows-x86_64, each with a SHA-256 file. Built by the Build Executa binaries workflow." \
            --latest=false
